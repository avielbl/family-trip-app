name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to compare the version against.
          fetch-depth: 2

      # The version is shown in the app footer and is how anyone tells which
      # build their device actually has — an installed PWA can keep serving a
      # cached bundle after a deploy. Shipping app changes without raising it
      # makes a stale install indistinguishable from a working one.
      - name: Version must be bumped with app changes
        run: |
          set -euo pipefail
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No previous commit to compare against — skipping."
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD -- src public package.json | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "No app changes in this push — version bump not required."
            exit 0
          fi
          previous=$(git show HEAD^:package.json | jq -r .version)
          current=$(jq -r .version package.json)
          if [ "$previous" = "$current" ]; then
            echo "::error::App files changed but package.json version is still $current."
            echo "Raise it — patch for a fix, minor for anything a user would notice."
            exit 1
          fi
          echo "Version $previous -> $current"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # NOTE: firestore.rules is NOT deployed from CI — the CI service account
      # lacks the Firebase Rules Admin role (grant it in Cloud IAM to automate
      # this). Until then, publish rule changes manually in the Firebase
      # Console → Firestore → Rules.
      # main → live site; stage → "stage" preview channel (separate URL,
      # posted in the run summary), so testing never overwrites production.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: ${{ github.ref_name == 'main' && 'live' || 'stage' }}
